<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FlatHub</title>
    <!-- Add to Home Screen: icon, name and colours. Onyx is the primary look; ivory when the phone is in light mode. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="FlatHub" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#F7F5F0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121214" />
    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; background: #121214; }
      @media (prefers-color-scheme: light) { body { background: #F7F5F0; } }
      #root { display: flex; height: 100%; flex: 1; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run FlatHub.</noscript>
    <div id="root"></div>
  </body>
</html>
