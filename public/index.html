<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FlatHub</title>
    <!-- Add to Home Screen: icon, name and colours. These two are the `ground` token in src/ui/kit.tsx,
         painted before JS loads; keep them in step with it or the app flashes the wrong canvas. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="FlatHub" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#F6F3EE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15130F" />
    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; background: #15130F; }
      @media (prefers-color-scheme: light) { body { background: #F6F3EE; } }
      /* Pinned to the visible screen. On touch phones the web stack sets `body { height }` from
         window.innerHeight (react-navigation's mobile-Chrome workaround), and a phone that reports
         more than it shows made the whole app taller than the screen: the tab bar fell off the
         bottom and nothing scrolled. Fixed to the viewport, the app's size no longer depends on
         the body's. */
      #root { display: flex; position: fixed; top: 0; right: 0; bottom: 0; left: 0; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run FlatHub.</noscript>
    <div id="root"></div>
  </body>
</html>
